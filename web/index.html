<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Converter</title>
  <meta name="description" content="Convert video, audio, images, documents and spreadsheets privately — right in your browser. Nothing is uploaded.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#e9e4f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16131c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Converter">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%235e9bff'/%3E%3Cstop offset='1' stop-color='%23345bf5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M18 26h24l-6-6M46 38H22l6 6' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="../shared/formats.js"></script>
  <script src="../shared/table.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="desktop">
    <div class="window" id="window">
      <aside class="sidebar" aria-label="Supported formats">
        <div class="lights" aria-hidden="true"><i class="red"></i><i class="yellow"></i><i class="green"></i></div>
        <div class="sb-heading">Formats</div>
        <nav class="sb-list" id="categoryList"></nav>
        <a class="sb-card" href="https://github.com/JonathanZehavi/converter#mac-quick-action" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.2.8 1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8 0 0-2.5-1-2.5-3.9zM14 5.5c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1 .1 2.1-.6 2.8-1.4z"/></svg>
          <div>
            <strong>Mac Quick Action</strong>
            <span>Right-click any file in Finder → Convert</span>
          </div>
        </a>
      </aside>

      <main class="main">
        <header class="toolbar">
          <div class="lights mobile-only" aria-hidden="true"><i class="red"></i><i class="yellow"></i><i class="green"></i></div>
          <div class="tb-title">
            <h1>Converter</h1>
            <p id="subtitle">Private · on-device</p>
          </div>
          <div class="tb-actions">
            <button class="tb-btn" id="addBtn" title="Add files" aria-label="Add files">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button class="btn primary" id="convertAllBtn" disabled>Convert All</button>
          </div>
        </header>

        <section class="content" id="content">
          <div class="empty" id="empty">
            <div class="drop-art" aria-hidden="true">
              <svg viewBox="0 0 96 96"><rect x="20" y="10" width="56" height="72" rx="10" class="sheet"/><path d="M48 32v28M36 48l12 12 12-12" class="arrow"/></svg>
            </div>
            <h2>Drop files to convert</h2>
            <p>Video, audio, images, documents and spreadsheets.<br>The right formats are picked for you automatically.</p>
            <button class="btn primary large" id="chooseBtn">Choose Files…</button>
            <div class="privacy">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
              Files never leave this device
            </div>
          </div>
          <ul class="files" id="fileList" aria-live="polite"></ul>
        </section>

        <footer class="statusbar">
          <span id="status">No files</span>
          <button class="link-btn" id="clearBtn" hidden>Clear All</button>
        </footer>
      </main>

      <div class="drop-overlay" id="dropOverlay" aria-hidden="true">
        <div><svg viewBox="0 0 24 24"><path d="M12 4v12M6 10l6 6 6-6M5 20h14"/></svg>Drop to add</div>
      </div>
    </div>
  </div>
  <input type="file" id="fileInput" multiple hidden>
</body>
</html>
